# Install once:  pre-commit install
# Run over everything: pre-commit run --all-files
#
# black is deliberately absent. This source is hand-wrapped to 79 columns so
# that comments sit beside the code they explain; black disagrees with 32 of
# 44 files, so adding it would silently reformat the whole package on the
# next commit. ruff enforces the column budget instead - see pyproject.toml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # docs/**/*.txt are generated by scripts/build_docs.sh. Editing them
        # here would make them differ from what the generator produces and
        # turn the CI drift check red.
        exclude: '\.txt$'
      - id: end-of-file-fixer
        exclude: '\.txt$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        # tools/ is excluded in pyproject.toml with the reason; passing the
        # files explicitly here would override that exclusion.
        files: '^(src|tests)/'

  - repo: local
    hooks:
      # Gitignore is advisory: `git add -f` beats it. This does not.
      # See the module docstring - a live EIA key really did reach logs/.
      - id: no-secrets
        name: block run logs and live credentials
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: true
        # Binary artefacts are skipped inside the script, but excluding the
        # generated document tree up front keeps the hook fast.
        exclude: '^docs/(figures|proposal)/'
